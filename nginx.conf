server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx:alpine's mime.types has no entry for .webmanifest, so it went out as
    # application/octet-stream. Re-declaring a types block replaces the whole map, hence
    # the include.
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; text/markdown md; }

    # Hashed assets are immutable; index.html must never be cached or deploys go unseen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Operator-provided legal texts (privacy.md, imprint.md), mounted at runtime. A missing
    # file is an empty 204, not the SPA shell, so the app hides the links to it; a 404 would
    # log a console error on every default install.
    location /legal/ {
        try_files $uri =204;
        charset utf-8;
        charset_types text/markdown text/plain;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The API is routed to the backend by the proxy in front. If a request still lands
    # here, answer 404 instead of the SPA shell so the client sees a clear error.
    location /api/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/markdown text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # This page loads no third-party code.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
