server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or deploys go unseen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API is routed to the backend by the proxy in front. If a request still lands
    # here, answer 404 instead of the SPA shell so the client sees a clear error.
    location /api/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # This page loads no third-party code.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
