# Builds the web dashboard and serves it on http://localhost:8080.
# The page calls the API same-origin at `/api`, so put a reverse proxy in front that
# routes `/api` to the backend; see deploy/traefik.example.yml for a Traefik setup.
name: sumry-web

services:
  web:
    build:
      context: .
      args:
        # Empty: same-origin `/api`. Set an absolute origin if the API lives elsewhere.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SUMRY_WEB_PORT:-8080}:80"
