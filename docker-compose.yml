# Explicit project name: this directory is also called "sumry", which would otherwise
# collide with the API stack at /opt/docker/sumry and let a `down` here stop that one.
name: sumry-web

services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: https://sumry-api.elyesghazel.ch
    container_name: "web-sumry"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sumry-web.rule=Host(`sumry.elyesghazel.ch`)"
      - "traefik.http.routers.sumry-web.entrypoints=https"
      - "traefik.http.routers.sumry-web.tls=true"
      - "traefik.http.routers.sumry-web.tls.certresolver=cloudflare"
      - "traefik.http.services.sumry-web.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_proxy"

networks:
  traefik_proxy:
    external: true
